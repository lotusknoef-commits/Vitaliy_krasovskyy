<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photography | Wild & Still</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans&family=Playfair+Display&display=swap');
*{box-sizing:border-box}
body{margin:0;background:#f2ede2;color:#243d32;font-family:'DM Sans',sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:24px 5%}
.logo{font:28px 'Playfair Display',serif}
nav{display:flex;gap:24px;flex-wrap:wrap}
nav a{text-decoration:none;color:#243d32;font-size:14px}
main{max-width:1250px;margin:auto;padding:60px 5%}
h1{font:clamp(48px,6vw,80px) 'Playfair Display',serif;margin:15px 0}
.intro{max-width:650px;margin-bottom:50px}
.eyebrow{color:#8b6e52;letter-spacing:3px;text-transform:uppercase;font-size:12px}
.filters{display:flex;gap:15px;flex-wrap:wrap;margin-bottom:40px}
select{background:#fffaf1;border:1px solid #c8c6b9;padding:14px;font:inherit;min-width:210px;color:#243d32}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:25px}
.photo{background:#fffaf1;padding-bottom:15px}
.photo img{width:100%;height:280px;object-fit:cover}
.photo h3{font:24px 'Playfair Display',serif;margin:15px 18px 5px}
.photo p{margin:0 18px;color:#526c50;font-size:13px}
footer{background:#243d32;color:#f2ede2;padding:30px 5%;margin-top:60px}
@media(max-width:750px){header{display:block}nav{margin-top:20px;gap:12px}.gallery{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<a class="logo" href="index.html">Wild & Still</a>
<nav>
<a href="index.html">Home</a>
<a href="photography.html">Photography</a>
<a href="tours.html">Birding Tours</a>
<a href="about.html">About</a>
<a href="contact.html">Get in touch</a>
</nav>
</header>

<main>
<div class="intro">
<p class="eyebrow">Through the lens</p>
<h1>Photography</h1>
<p>A collection of wild moments, close to home. Explore the birds, landscapes and quiet corners of the Netherlands.</p>
</div>

<div class="filters">
<select id="location"><option value="">All locations</option></select>
<select id="category"><option value="">All categories</option></select>
</div>

<div class="gallery" id="gallery"></div>
</main>

<footer>Wild & Still · Nature Photography & Birding</footer>

<script>
const photos=[
{title:"Wetland Morning",location:"Abcoude",category:"Waterbirds",image:"https://images.unsplash.com/photo-1474511320723-9a56873867b5?w=900"},
{title:"Among the Reeds",location:"Mijdrecht",category:"Songbirds",image:"https://images.unsplash.com/photo-1444464666168-49d633b86797?w=900"},
{title:"Wings Above",location:"Vinkeveen",category:"Birds of Prey",image:"https://images.unsplash.com/photo-1452570053594-1b985d6ea890?w=900"},
{title:"Quiet Waters",location:"Abcoude",category:"Landscapes",image:"https://images.unsplash.com/photo-1472396961693-142e6e269027?w=900"},
{title:"Forest Light",location:"Mijdrecht",category:"Landscapes",image:"https://images.unsplash.com/photo-1448375240586-882707db888b?w=900"},
{title:"Wild Moments",location:"Vinkeveen",category:"Songbirds",image:"https://images.unsplash.com/photo-1444464666168-49d633b86797?w=900"}
];

const loc=document.getElementById("location");
const cat=document.getElementById("category");
const gallery=document.getElementById("gallery");

[...new Set(photos.map(p=>p.location))].sort().forEach(v=>loc.add(new Option(v,v)));
[...new Set(photos.map(p=>p.category))].sort().forEach(v=>cat.add(new Option(v,v)));

function render(){
const filtered=photos.filter(p=>
(!loc.value||p.location===loc.value)&&
(!cat.value||p.category===cat.value)
);
gallery.innerHTML=filtered.map(p=>`
<div class="photo">
<img src="${p.image}" alt="${p.title}">
<h3>${p.title}</h3>
<p>${p.location} · ${p.category}</p>
</div>`).join("")||"<p>No photographs found for these filters.</p>";
}
loc.addEventListener("change",render);
cat.addEventListener("change",render);
render();
</script>
</body>
</html>
